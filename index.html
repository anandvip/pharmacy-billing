<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4a">
<title>Counter Khata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Counter Khata: offline credit khata and itemized billing for pharmacies. © 2026 Vipul Anand, Kurukshetra.">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2421;--mute:#6b736f;--line:#e3e1da;--pri:#0f6b4a;--pri2:#e7f3ed;--red:#b42318;--red2:#fdecea;--amb:#8a5a00;--amb2:#fff4d6;--rad:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:140px}
.savebar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 -6px 20px rgba(0,0,0,.12);margin:14px 0 8px}
.savebar .net{flex:1;min-width:0}.savebar .net span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.savebar .net b{font-size:24px;color:var(--pri);line-height:1.15}
.savebar .acts{margin:0;flex:0 0 auto}.savebar .acts .btn{flex:0 0 auto;min-width:0}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.seg button+button{border-left:1px solid var(--line)}
table.t.year td,table.t.year th{font-size:13px;padding:6px 4px}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .t{flex:1;min-width:0}
header.top b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top small{opacity:.85;font-size:12px}
main{max-width:760px;margin:0 auto;padding:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button,nav.tabs a{flex:1;border:0;background:none;padding:8px 2px 10px;font:inherit;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;text-decoration:none}
nav.tabs .ic{font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:12px}
h2{font-size:12px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
h3{margin:0;font-size:18px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #d4d1c8;border-radius:10px;background:#fff;color:inherit;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.btn{font:inherit;border:1px solid #d4d1c8;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:42px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff;font-weight:600}
.btn.red{color:var(--red);border-color:#f0c4bf}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.btn.link{border:0;background:none;color:var(--pri);padding:4px 0;min-height:0;font-weight:600}
.btn.link.due{color:var(--red)}
table.t td.nw{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it>div:first-child{min-width:0}
.mute{color:var(--mute);font-size:13px}
.r{text-align:right}
.due{color:var(--red);font-weight:700}
.adv{color:var(--pri);font-weight:700}
.chips{margin-top:10px}
.chip{display:inline-block;padding:7px 11px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:0 6px 6px 0;font:inherit;font-size:13px;border:0;cursor:pointer}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--amb2);color:var(--amb);margin-left:4px;vertical-align:middle;font-weight:600}
.badge.red{background:var(--red2);color:var(--red)}
.badge.grn{background:var(--pri2);color:var(--pri)}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px;background:var(--amb2);color:#5c4100;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.info{background:var(--pri2);color:#0b4a33}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid #d4d1c8;background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
.stepper input{text-align:center;padding:6px;min-width:0}
.tot{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:19px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);height:100%}
.bars .pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.bars i{display:block;width:38%;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px}
.bars i.c{background:#8cc9ad}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--mute);cursor:pointer;padding:0 4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 auto}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.seg{display:flex;border:1px solid #d4d1c8;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--mute);font-weight:600}
table.t .r{text-align:right;white-space:nowrap}
table.t tr[data-act]{cursor:pointer}
.void{text-decoration:line-through;opacity:.55}
.empty{padding:14px;text-align:center;color:var(--mute)}
.money-in{color:var(--pri)}
.mc{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:10px}
.mc-title{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px 8px;margin-top:10px}
.mc-grid small{display:block;font-size:11px;color:var(--mute);margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em}
.ie{display:inline-block;min-width:44px;min-height:32px;padding:5px 8px;border:1px dashed #cfcac0;border-radius:8px;cursor:text;background:#fff;transition:background .4s,border-color .2s;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.mc-grid .ie{display:block}
.ie:hover,.ie:focus-visible{border-color:var(--pri);outline:none}
.ie.editing{border:2px solid var(--pri);padding:0;background:#fffdf3;box-shadow:0 0 0 3px rgba(15,107,74,.18)}
.ie.editing input,.ie.editing select{border:0;min-height:34px;padding:4px 8px;background:transparent;outline:none;width:100%;min-width:96px;border-radius:8px}
.ie.saving{opacity:.55}
.ie.saved{background:#d3efe0;border-style:solid;border-color:var(--pri)}
.ie.ie-err{background:var(--red2);border-style:solid;border-color:var(--red)}
.ie i{font-style:normal;color:var(--mute)}
.app-foot{text-align:center;font-size:12px;color:var(--mute);padding:14px 0 6px}
.img-prev{width:100%;border:1px solid var(--line);border-radius:8px}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important}#print-area img{width:100%}body{padding:0;background:#fff}}
</style>

<body>
<header class="top"><div class="t"><b id="shopTitle">Counter Khata</b><small id="shopSub">Counter Khata</small></div></header>
<main id="main"><p class="empty">Opening the khata…</p></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<input type="file" id="f-restore" accept=".json,application/json" hidden>
<input type="file" id="f-clients" accept=".csv,text/csv" hidden>
<input type="file" id="f-stock" accept=".csv,text/csv" hidden>
<noscript><p style="padding:20px">Counter Khata needs JavaScript turned on.</p></noscript>
<script>
'use strict';
/* =========================================================
   Counter Khata — offline day book for a pharmacy counter.
   All data stays in this browser (IndexedDB). No server.
   Money is kept in paise (integers) so totals never drift.
   ========================================================= */
const STORES=['settings','clients','meds','bills','payments','returns','rx'];
const S={settings:null,clients:[],meds:[],bills:[],payments:[],returns:[],rx:[]};
let db, persisted=false, pinUntil=0, pendingLogo=null;
const C={cid:null,cart:[],paid:'',mode:null,date:null,edit:null,override:'',ovrOpen:false};   // counter state
const R={m:null,mode:'month',y:null};                                   // reports: month | year | fy
let view='counter', sub=null;

/* ---------- small helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&#38;','<':'&#60;','>':'&#62;','"':'&#34;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());                         // local date, not UTC
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+Math.round(n));return dstr(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ymOf=s=>s.slice(0,7);
const thisYM=()=>today().slice(0,7);
const monthEnd=m=>{const[y,mo]=m.split('-').map(Number);return dstr(new Date(y,mo,0))};
const shiftYM=(m,k)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mName=m=>{const[y,mo]=m.split('-').map(Number);return MON[mo-1]+' '+y};
const thisYear=()=>+today().slice(0,4);
const fyStartYear=(d=today())=>{const[Y,M]=d.split('-').map(Number);return M>=4?Y:Y-1};
const fyRange=y=>({y,start:y+'-04-01',end:(y+1)+'-03-31',label:'FY '+y+'-'+String(y+1).slice(2)});
const yearRange=y=>({y,start:y+'-01-01',end:y+'-12-31',label:String(y)});
const reportPeriod=()=>{if(R.mode==='fy'){const y=R.y!=null?R.y:fyStartYear();return fyRange(y)}
 if(R.mode==='year'){const y=R.y!=null?R.y:thisYear();return yearRange(y)}
 return null};
const sdate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${+d} ${MON[+m-1]} ’${y.slice(2)}`};
const fdate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${+d} ${MON[+m-1]} ${y}`};
const rs=p=>{p=Math.round(p||0);const neg=p<0;p=Math.abs(p);return(neg?'−':'')+'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2})};
const toP=v=>{const n=parseFloat(String(v??'').replace(/[₹,\s]/g,''));return isFinite(n)?Math.round(n*100):NaN};
const rupees=p=>(Math.round(p||0)/100).toFixed(2);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const int=v=>Math.max(0,Math.round(num(v)));
const digits=s=>String(s||'').replace(/\D/g,'');
const normPhone=s=>{let d=digits(s);if(d.length===12&&d.startsWith('91'))d=d.slice(2);if(d.length===11&&d.startsWith('0'))d=d.slice(1);return d};
const waPhone=s=>{const d=normPhone(s);return d.length===10?'91'+d:''};

const client=id=>S.clients.find(x=>x.id===id);
const med=id=>S.meds.find(x=>x.id===id);
const bill=id=>S.bills.find(x=>x.id===id);
const billNo=id=>{const b=bill(id);return b?b.no:'?'};
const medLabel=m=>m?(m.name+(m.strength?' '+m.strength:'')):'';
const shopName=()=>S.settings.name||'Sample Medical Store';
const capOn=()=>{const v=num(S.settings.discCap);return v>0&&v<100};      // 0 = no discount limit
const cap=()=>capOn()?num(S.settings.discCap):100;
/* medicine types: what the pack is called, what it is counted in, and whether it can be sold loose */
const FORMS={tablet:{label:'Tablet',pack:'strip',unit:'tablet',tps:10,loose:true},capsule:{label:'Capsule',pack:'strip',unit:'capsule',tps:10,loose:true},
 syrup:{label:'Syrup / liquid',pack:'bottle',unit:'ml',tps:100,loose:false},drops:{label:'Drops',pack:'bottle',unit:'ml',tps:10,loose:false},
 injection:{label:'Injection / shot',pack:'vial',unit:'vial',tps:1,loose:false},cartridge:{label:'Cartridge / insulin pen',pack:'box',unit:'cartridge',tps:5,loose:true},
 inhaler:{label:'Inhaler',pack:'inhaler',unit:'puff',tps:200,loose:false},cream:{label:'Cream / ointment',pack:'tube',unit:'g',tps:20,loose:false},
 sachet:{label:'Sachet / powder',pack:'box',unit:'sachet',tps:10,loose:true},churna:{label:'Churna / jar',pack:'jar',unit:'g',tps:100,loose:false},
 other:{label:'Other',pack:'pack',unit:'unit',tps:1,loose:false}};
const KINDS={allopathic:'Allopathic',ayurvedic:'Ayurvedic',homeopathic:'Homeopathic',unani:'Unani',surgical:'Surgical / device',other:'Other'};
const PACKS=['strip','bottle','box','vial','ampoule','cartridge','pen','inhaler','tube','jar','packet','sachet','pack'];
const UNITS=['tablet','capsule','ml','g','vial','ampoule','cartridge','pen','puff','dose','sachet','unit'];
const fm=x=>{const k=x&&FORMS[x.form]?x.form:'tablet';const f=FORMS[k];return{form:k,pack:(x&&x.pack)||f.pack,unit:(x&&x.unit)||f.unit,loose:x&&x.looseOk!=null?!!x.looseOk:f.loose}};
const pl=(w,n)=>w==='g'?(n===1?'gram':'grams'):n===1||['ml','mg','mcg','IU'].includes(w)?w:/(s|x|ch|sh)$/.test(w)?w+'es':w+'s';
const cap1=w=>!w||w==='ml'?w:w[0].toUpperCase()+w.slice(1);
const packDesc=(x,tps)=>{const d=fm(x);tps=tps??x.tps;return tps>1?`${d.pack} of ${tps} ${pl(d.unit,tps)}`:d.pack};
const kindBadge=x=>x&&x.kind&&x.kind!=='allopathic'?`<span class="badge grn">${esc(KINDS[x.kind]||x.kind)}</span>`:'';
const PER={day:1,week:7,month:30};
const doseDay=r=>num(r.dose)/(PER[r.per||'day']||1);
const hasSample=()=>STORES.some(s=>s!=='settings'&&S[s].some(x=>x.sample||x.practice));
const isPractice=()=>!S.settings.name;   // anything typed before the real shop name is saved is practice
const stockText=(units,x)=>{const d=fm(x);const tps=Math.max(1,x.tps||1);units=Math.round(units||0);const neg=units<0;units=Math.abs(units);const s=Math.floor(units/tps),l=units%tps;let t=s+' '+pl(d.pack,s);if(l)t+=' + '+l+' '+pl(d.unit,l);return(neg?'−':'')+t};
const qtyText=it=>{const d=fm(it);const p=[];if(it.strips)p.push(it.strips+' '+pl(d.pack,it.strips));if(it.loose)p.push(it.loose+' '+pl(d.unit,it.loose));return p.join(' + ')||'0'};

function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms)}

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('counter-khata',1);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
function getAll(s){return new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
/* one atomic transaction for every save: bill + stock + payment succeed or fail together */
function commit(ops){return new Promise((res,rej)=>{const stores=[...new Set(ops.map(o=>o.store))];const t=db.transaction(stores,'readwrite');for(const o of ops){const os=t.objectStore(o.store);if(o.clear)os.clear();else if(o.del!=null)os.delete(o.del);else os.put(o.value)}t.oncomplete=()=>{ops.forEach(applyMem);res()};t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Save was cancelled'))})}
function applyMem(o){if(o.store==='settings'){if(o.value)S.settings=o.value;return}const a=S[o.store];if(o.clear){a.length=0;return}if(o.del!=null){const i=a.findIndex(x=>x.id===o.del);if(i>=0)a.splice(i,1);return}const i=a.findIndex(x=>x.id===o.value.id);if(i>=0)a[i]=o.value;else a.push(o.value)}

/* ---------- PIN (soft lock, hashed, never stored as plain text) ---------- */
async function hashPin(pin,algo){algo=algo||(window.crypto&&crypto.subtle?'sha256':'djb2');const s='ck-pin:'+pin;if(algo==='sha256'){if(!(window.crypto&&crypto.subtle))throw new Error('PIN check needs the https page');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return'sha256:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return'djb2:'+h.toString(16)}
async function pinOk(pin){const st=S.settings.pinHash||'';try{return(await hashPin(pin,st.split(':')[0]))===st}catch(e){toast(e.message);return false}}

/* ---------- money logic ---------- */
function lineCalc(l){const tps=Math.max(1,int(l.tps));const tablets=int(l.strips)*tps+int(l.loose);const gross=Math.round(l.mrp*tablets/l.medTps);const disc=Math.round(gross*num(l.disc)/100);return{tablets,gross,disc,net:gross-disc}}
function billCalc(lines){let gross=0,disc=0,net=0;for(const l of lines){const c=lineCalc(l);gross+=c.gross;disc+=c.disc;net+=c.net}const total=Math.round(net/100)*100;return{gross,disc,net,roundOff:total-net,total}}
/* pharmacist can charge a different bill amount: never above MRP total; below the discount cap needs the PIN */
function finalCalc(){const t=billCalc(C.cart);const o=String(C.override||'').trim();const base={...t,calc:t.total,adjust:0,err:''};if(!o)return base;const v=toP(o);
 if(isNaN(v)||v<=0)return{...base,err:'Changed bill amount is not a valid number'};if(v>t.gross)return{...base,err:`Bill amount cannot be more than the MRP total ${rs(t.gross)}`};return{...base,total:v,adjust:v-t.total}}
const overCap=(gross,total)=>capOn()&&gross>0&&(gross-total)/gross*100>cap()+1e-9;
/* how the bill is paid: cash / UPI = paid now (blank = full bill), credit = all on the khata. Clients default to credit, walk-ins to cash */
const payMode=()=>{const walk=C.cid==='walkin';if(walk&&(!C.mode||C.mode==='credit'))return'cash';return C.mode||'credit'};
function paidNow(total){const mode=payMode();if(mode==='credit')return 0;const ps=String(C.paid).trim();return ps===''?total:toP(ps)}
const CREDIT='© 2026 · Created by Vipul Anand, Kurukshetra';
const thanksLine=()=>`Thanks for being a customer of ${shopName()}.`;
const MODE_TXT={cash:'Cash',upi:'UPI',credit:'Credit (khata)'};
const linkedPay=bid=>S.payments.find(p=>p.billId===bid&&!p.voided);
const billReturns=bid=>S.returns.filter(r=>r.billId===bid&&!r.voided);
const returnedTabs=(bid,mid)=>billReturns(bid).reduce((s,r)=>s+r.items.filter(i=>i.medId===mid).reduce((a,i)=>a+i.tablets,0),0);

/* balances for every client in one pass (optionally as of a date) */
function balances(upto){const m={};const add=(c,v)=>{if(c)m[c]=(m[c]||0)+v};for(const c of S.clients)if(!upto||(c.openingDate||'')<=upto)add(c.id,c.openingBal||0);for(const b of S.bills)if(!b.voided&&(!upto||b.date<=upto))add(b.clientId,b.total);for(const r of S.returns)if(!r.voided&&(!upto||r.date<=upto))add(r.clientId,-r.total);for(const p of S.payments)if(!p.voided&&(!upto||p.date<=upto))add(p.clientId,-p.amount);return m}
const balance=cid=>balances()[cid]||0;

/* khata entries oldest → newest with running balance. Nothing is stored as a total; it is always recomputed,
   so correcting an old bill automatically corrects every later month. */
function ledger(cid){const c=client(cid);const E=[];
 if(c&&c.openingBal)E.push({date:c.openingDate||'0000-00-00',k:0,kind:'open',text:'Opening balance (paper book)',amt:c.openingBal,t:0});
 for(const b of S.bills)if(b.clientId===cid&&!b.voided)E.push({date:b.date,k:1,kind:'bill',text:`Bill #${b.no} · ${b.items.length} item${b.items.length>1?'s':''}`,amt:b.total,ref:b.id,t:b.createdAt});
 for(const r of S.returns)if(r.clientId===cid&&!r.voided)E.push({date:r.date,k:2,kind:'ret',text:`Return on bill #${billNo(r.billId)}`,amt:-r.total,ref:r.id,t:r.createdAt});
 for(const p of S.payments)if(p.clientId===cid&&!p.voided)E.push({date:p.date,k:3,kind:'pay',text:`Received · ${p.mode==='upi'?'UPI':'Cash'}${p.billId?' (with bill #'+billNo(p.billId)+')':''}${p.note?' · '+p.note:''}`,amt:-p.amount,ref:p.id,t:p.createdAt});
 E.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t-b.t)||(a.k-b.k));
 let bal=0;for(const e of E){bal+=e.amt;e.bal=bal}return E}

/* month bill: brought forward + medicines − returns − received = closing due */
function statement(cid,m){const start=m+'-01',end=monthEnd(m);let bf=0,open=0,meds=0,rets=0,paid=0;const rows=[];
 for(const e of ledger(cid)){if(e.date<start){bf+=e.amt;continue}if(e.date>end)continue;rows.push(e);
  if(e.kind==='open')open+=e.amt;else if(e.kind==='bill')meds+=e.amt;else if(e.kind==='ret')rets-=e.amt;else paid-=e.amt}
 return{bf,open,meds,rets,paid,closing:bf+open+meds-rets-paid,rows,start,end}}
function rangeStatement(cid,start,end){let bf=0,open=0,meds=0,rets=0,paid=0;const rows=[];
 for(const e of ledger(cid)){if(e.date<start){bf+=e.amt;continue}if(e.date>end)continue;rows.push(e);
  if(e.kind==='open')open+=e.amt;else if(e.kind==='bill')meds+=e.amt;else if(e.kind==='ret')rets-=e.amt;else paid-=e.amt}
 return{bf,open,meds,rets,paid,closing:bf+open+meds-rets-paid,rows,start,end}}
function periodNums(start,end){const bills=S.bills.filter(b=>!b.voided&&b.date>=start&&b.date<=end);const billed=bills.reduce((s,b)=>s+b.total,0);
 const rets=S.returns.filter(r=>!r.voided&&r.date>=start&&r.date<=end).reduce((s,r)=>s+r.total,0);const got=S.payments.filter(p=>!p.voided&&p.date>=start&&p.date<=end).reduce((s,p)=>s+p.amount,0);return{bills,billed,rets,got}}

/* refill & stash: tablets bought ÷ dose per day, chained purchase after purchase */
function coverage(r){const purchases=[];
 for(const b of S.bills){if(b.voided||b.clientId!==r.clientId)continue;for(const it of b.items)if(it.medId===r.medId){const tabs=it.tablets-returnedTabs(b.id,it.medId);if(tabs>0)purchases.push({date:b.date,tabs})}}
 purchases.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
 if(!(doseDay(r)>0))return{due:null,ahead:0,stash:false,last:null};
 let end=null;for(const p of purchases){const st=end&&end>p.date?end:p.date;end=addDays(st,p.tabs/doseDay(r))}
 const due=end||r.startDate||today();const ahead=daysBetween(today(),due);
 return{due,ahead,stash:ahead>45,last:purchases.length?purchases[purchases.length-1].date:null}}
function dueText(cv){if(!cv.due)return'';const d=cv.ahead;if(d<0)return`<span class="badge red">overdue ${-d} day${d===-1?'':'s'}</span>`;if(d===0)return'<span class="badge red">due today</span>';if(d<=3)return`<span class="badge">due in ${d} day${d===1?'':'s'}</span>`;return`<span class="mute">next ${fdate(cv.due)}</span>`}

/* ---------- modals ---------- */
function modal(title,html){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">×</button></div>${html}</div>`;ov.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal(ov)});document.body.appendChild(ov);const f=ov.querySelector('input:not([type=hidden]):not([type=file]),select');if(f&&!f.dataset.nofocus)setTimeout(()=>f.focus(),60);return ov}
function closeModal(ov){ov=ov||[...document.querySelectorAll('.ov')].pop();if(!ov)return;ov.remove();if(ov._onClose)ov._onClose()}
function closeAll(){document.querySelectorAll('.ov').forEach(o=>closeModal(o))}
function confirmBox(msg,ok='Yes',danger=false){return new Promise(res=>{const ov=modal('Please confirm',`<p>${msg}</p><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn ${danger?'red':'pri'}" id="cfOk">${esc(ok)}</button></div>`);let done=false;ov._onClose=()=>{if(!done)res(false)};$('#cfOk',ov).onclick=()=>{done=true;ov.remove();res(true)}})}
function askPin(why){if(Date.now()<pinUntil)return Promise.resolve(true);return new Promise(res=>{const ov=modal('Pharmacist PIN',`<p class="mute">${esc(why)}</p><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN"><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="pinOk">Unlock</button></div><p class="hint">Stays unlocked for 5 minutes.</p>`);const inp=$('#pinIn',ov);let done=false;ov._onClose=()=>{if(!done)res(false)};const go=async()=>{if(await pinOk(inp.value.trim())){done=true;pinUntil=Date.now()+5*60e3;ov.remove();res(true)}else{inp.value='';inp.focus();toast('Wrong PIN')}};$('#pinOk',ov).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}})}

function go(v,s=null){view=v;sub=s;render();window.scrollTo(0,0)}

}
function banners(){let h='';
 if(hasSample())h+=S.settings.name?`<div class="banner"><span>Practice records are still on this phone.</span><button class="btn sm" data-act="clearSample">Clear them</button></div>`:`<div class="banner"><span><b>Practice mode.</b> Sample shop and clients. Save your real shop name under Shop to begin.</span><button class="btn sm" data-act="tab" data-v="shop">Shop</button></div>`;
 const real=S.bills.some(b=>!b.sample&&!b.practice)||S.clients.some(c=>!c.sample&&!c.practice);
 const lb=S.settings.lastBackup;
 if(real&&(!lb||Date.now()-lb>7*864e5))h+=`<div class="banner"><span>Last backup: <b>${lb?fdate(dstr(new Date(lb))):'never'}</b>. If this phone is lost, the khata goes with it.</span><button class="btn sm" data-act="backupJson">Back up</button></div>`;

 return(eb?`<div class="banner info"><span>Editing <b>bill #${eb.no}</b>. Save to replace it.</span><button class="btn sm" data-act="cancelEdit">Cancel edit</button></div>`:'')+
 `<div class="card" id="c-client"></div><div id="c-add"></div><div id="c-cart"></div><div class="card" id="c-today"></div>`}

function fillCClient(){const el=$('#c-client');if(!el)return;
 if(!C.cid){
  const recent=recentClients();
  el.innerHTML=`<h2>Who is buying?</h2><input id="cq" placeholder="Client name or phone" autocomplete="off" aria-label="Search client"><div id="cq-res" class="list"></div>
  ${recent.length?`<div class="chips" aria-label="Recent clients">${recent.map(c=>`<button type="button" class="chip" data-act="pickClient" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}
  <div class="acts"><button class="btn" data-act="walkin">Walk-in cash sale</button><button class="btn" data-act="newClient" data-from="counter">+ New client</button></div>
  <h2 style="margin-top:16px">Refills due (next 3 days)</h2><div class="list">${refillList()}</div>`;return}
 if(C.cid==='walkin'){el.innerHTML=`<div class="row"><div class="grow"><h3>Walk-in customer</h3><div class="mute">Cash sale, paid in full. Not added to any khata.</div></div><button class="btn sm" data-act="changeClient">Change</button></div>`;return}
 const c=client(C.cid);if(!c){C.cid=null;return fillCClient()}
 const pend=pendingNow();const rx=S.rx.filter(r=>r.clientId===c.id&&r.active!==false);
 const bought={};for(const b of S.bills)if(b.clientId===c.id&&!b.voided)for(const it of b.items)bought[it.medId]=(bought[it.medId]||0)+1;
 const extra=Object.keys(bought).filter(id=>!rx.some(r=>r.medId===id)&&med(id)&&!med(id).archived).sort((a,b)=>bought[b]-bought[a]).slice(0,4);
 const last=lastBill(c.id);
 el.innerHTML=`<div class="row"><div class="grow"><h3>${esc(c.name)}</h3><div class="mute">${esc(c.phone||'no phone')}${c.address?' · '+esc(c.address):''}</div></div>
  <div class="r"><div class="mute">Pending khata</div><button class="btn link ${pend>0?'due':''}" data-act="openKhata" data-id="${c.id}">${rs(pend)} ›</button></div></div>
  <div class="chips">${rx.map(r=>{const m=med(r.medId);if(!m)return'';const cv=coverage(r);return`<button class="chip" data-act="addMed" data-id="${m.id}" data-n="${int(r.usual)||1}">+ ${esc(medLabel(m))} ×${int(r.usual)||1} ${cv.ahead<=3&&cv.due?'⏰':''}</button>`}).join('')}${extra.map(id=>`<button class="chip" data-act="addMed" data-id="${id}" data-n="1">+ ${esc(medLabel(med(id)))}</button>`).join('')}</div>
  <div class="acts">${last?`<button class="btn" data-act="repeatLast">Repeat last bill (${fdate(last.date)})</button>`:''}<button class="btn sm" data-act="changeClient">Change client</button></div>`}
function refillList(){const rows=[];for(const r of S.rx){if(r.active===false)continue;const c=client(r.clientId),m=med(r.medId);if(!c||!m)continue;const cv=coverage(r);if(cv.due&&cv.ahead<=3)rows.push({r,c,m,cv})}
 rows.sort((a,b)=>a.cv.ahead-b.cv.ahead);
 return rows.length?rows.map(x=>`<div class="it" data-act="refill" data-id="${x.r.id}"><div><b>${esc(x.c.name)}</b><div class="mute">${esc(medLabel(x.m))} ×${int(x.r.usual)||1}</div></div><div class="r">${dueText(x.cv)}</div></div>`).join(''):'<div class="empty">Nothing due. Add prescriptions on a client’s khata to see refills here.</div>'}
function recentClients(n=6){const seen=[];const have=new Set();
 for(const b of [...S.bills].sort((a,b)=>b.createdAt-a.createdAt)){if(!b.clientId||b.voided||have.has(b.clientId))continue;const c=client(b.clientId);if(!c)continue;have.add(c.id);seen.push(c);if(seen.length>=n)break}
 return seen}
function lastBill(cid){return S.bills.filter(b=>b.clientId===cid&&!b.voided).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt)[0]}
function fillCAdd(){const el=$('#c-add');if(!el)return;if(!C.cid){el.innerHTML='';return}
 el.innerHTML=`<div class="card"><h2>Add medicine</h2><input id="mq" placeholder="Search stock by name or salt" autocomplete="off" aria-label="Search stock"><div id="mq-res" class="list"></div></div>`}
function searchMeds(q){q=q.trim().toLowerCase();if(!q)return[];return S.meds.filter(m=>!m.archived&&(medLabel(m).toLowerCase().includes(q)||(m.salt||'').toLowerCase().includes(q))).slice(0,8)}
function medRow(m,act='addMed'){const low=m.stockTab<(num(m.minStrips??S.settings.lowStrips))*m.tps;return`<div class="it" data-act="${act}" data-id="${m.id}" data-n="1"><div><b>${esc(medLabel(m))}</b><div class="mute">${esc(m.salt||'')} · ${packDesc(m)} · ${rs(m.mrp)}/${fm(m).pack}${m.disc?' · '+m.disc+'% off':''} ${kindBadge(m)}</div></div><div class="r mute">${stockText(m.stockTab,m)}${m.stockTab<=0?'<span class="badge red">out</span>':low?'<span class="badge">low</span>':''}${expBadge(m)}</div></div>`}
function expBadge(m){if(!m.expiry)return'';if(m.expiry<thisYM())return'<span class="badge red">expired</span>';if(m.expiry<=ymOf(addDays(today(),60)))return`<span class="badge">exp ${mName(m.expiry)}</span>`;return''}
function pendingNow(){if(!C.cid||C.cid==='walkin')return 0;let b=balance(C.cid);if(C.edit){const ob=bill(C.edit);if(ob&&!ob.voided){b-=ob.total;const op=linkedPay(ob.id);if(op)b+=op.amount}}return b}
function shelfFor(l){const m=med(l.medId);let s=m?m.stockTab:0;if(C.edit){const ob=bill(C.edit);if(ob)for(const it of ob.items)if(it.medId===l.medId)s+=it.tablets}return s}

function renderCart(){const el=$('#c-cart');if(!el)return;if(!C.cid){el.innerHTML='';return}
 if(!C.cart.length){el.innerHTML='<div class="card empty">No medicines yet. Tap a usual medicine above, repeat the last bill, or search stock.</div>';return}
 const lines=C.cart.map((l,i)=>{const c=lineCalc(l);const shelf=shelfFor(l);const m=med(l.medId);
  const d=fm(l);const P=cap1(pl(d.pack,2)),U=pl(d.unit,2);
  return`<div class="line"><div class="row"><div class="grow"><b>${esc(l.name)}</b> ${kindBadge(m)}<div class="mute">${esc(l.salt||'')} · MRP ${rs(l.mrp)} per ${packDesc(l,l.medTps)}</div></div><button class="x" data-act="rmLine" data-i="${i}" aria-label="Remove">×</button></div>
  <div class="grid2"><div><label>${P}</label><div class="stepper"><button data-act="dec" data-i="${i}" aria-label="One ${d.pack} less">−</button><input data-f="strips" data-i="${i}" value="${int(l.strips)}" inputmode="numeric" aria-label="${P}"><button data-act="inc" data-i="${i}" aria-label="One ${d.pack} more">+</button></div></div>
  ${d.loose?`<div><label>Loose ${U}</label><input data-f="loose" data-i="${i}" value="${int(l.loose)||''}" placeholder="0" inputmode="numeric"></div>
  <div><label>${cap1(U)} in one ${d.pack}</label><input data-f="tps" data-i="${i}" value="${l.tps}" inputmode="numeric"></div>`:''}
  <div><label>Discount %${capOn()?` (max ${cap()})`:''}</label><input data-f="disc" data-i="${i}" value="${num(l.disc)}" inputmode="decimal"></div></div>
  <div class="tot" style="margin-top:8px"><span class="mute">${qtyText(l)}${l.tps>1?` = ${c.tablets} ${pl(d.unit,c.tablets)}`:''} · ${rs(c.gross)}${c.disc?' − '+rs(c.disc):''}</span><b>${rs(c.net)}</b></div>
  ${c.tablets>shelf?`<div class="hint" style="color:var(--red)">Shelf shows only ${stockText(shelf,m||{...l,tps:l.medTps})}. You can still save; please recount.</div>`:''}${m?expBadge(m):''}</div>`}).join('');
 const t=finalCalc();const walk=C.cid==='walkin';const pend=pendingNow();
 if(!C.date)C.date=today();
 el.innerHTML=`<div class="card"><h2>Bill</h2>${lines}
 <div class="tot"><span>MRP total</span><span>${rs(t.gross)}</span></div>
 <div class="tot"><span>Discount</span><span>−${rs(t.disc)}</span></div>
 ${t.roundOff?`<div class="tot"><span>Round off</span><span>${t.roundOff>0?'+':''}${rs(t.roundOff)}</span></div>`:''}
 ${t.adjust?`<div class="tot"><span>Calculated total</span><span>${rs(t.calc)}</span></div><div class="tot"><span>Changed by pharmacist</span><span>${t.adjust>0?'+':''}${rs(t.adjust)}</span></div>`:''}
 <div class="tot big"><span>Bill total</span><span class="row" style="gap:8px">${rs(t.total)}<button class="btn sm" data-act="ovr" aria-expanded="${C.ovrOpen}">✎ Change</button></span></div>
 <div id="ovr-box" ${C.ovrOpen?'':'hidden'}><label for="ovr">Charge this amount instead (₹)</label><div class="row"><input id="ovr" class="grow" value="${esc(C.override)}" inputmode="decimal" placeholder="${t.calc/100}"><button class="btn sm" data-act="ovrClear">Use calculated</button></div>
 ${t.err?`<p class="hint" style="color:var(--red)">${esc(t.err)}</p>`:''}<p class="hint">Cannot go above the MRP total (${rs(t.gross)}).${capOn()?` A cut deeper than the ${cap()}% limit asks for the pharmacist PIN.`:''}</p></div>
 <div class="tot" style="background:var(--pri2);border-radius:8px;padding:6px 8px;margin:4px 0"><b class="money-in">Net savings on this bill</b><b class="money-in">${rs(Math.max(0,t.gross-t.total))}</b></div>
 ${walk?'':`<div class="tot"><span>Previous due</span><span class="${pend>0?'due':''}">${rs(pend)}</span></div>`}
 <label>Paid by</label><div class="seg" role="group" aria-label="Paid by">${['cash','upi','credit'].map(k=>`<button data-act="mode" data-v="${k}" class="${payMode()===k?'on':''}" ${walk&&k==='credit'?'disabled title="Walk-in sale cannot go on credit"':''} aria-pressed="${payMode()===k}">${k==='credit'?'Credit':MODE_TXT[k]}</button>`).join('')}</div>
 <div class="grid2"><div><label>${payMode()==='credit'?'Received now':'Received now (₹)'}</label><input id="paid" value="${payMode()==='credit'?'':esc(C.paid)}" placeholder="${payMode()==='credit'?'Nothing · on khata':'Full '+rs(t.total).replace('₹','₹ ')}" inputmode="decimal" ${payMode()==='credit'?'disabled':''}></div>
 <div><label>Bill date</label><input type="date" id="bdate" value="${C.date}" max="${today()}"></div></div>
 <div id="newbal">${newBalHtml()}</div>
 <div class="savebar" id="savebar"><div class="net"><span>Net total</span><b>${rs(t.total)}</b></div><div class="acts"><button class="btn pri" data-act="saveBill">${C.edit?'Save changes':'Save'}</button><button class="btn wa" data-act="saveBill" data-share="1">Save &#38; WhatsApp</button></div></div>
 ${walk?'':`<p class="hint">${payMode()==='credit'?'Credit: the whole bill goes on the khata.':'Cash/UPI: leave “Received now” blank if the full bill is paid, or type the part paid. The rest goes on the khata.'} The khata carries into next month and is never wiped at month end.</p>`}${C.date<today()?`<p class="hint">Old paper entry: this bill will count in <b>${mName(ymOf(C.date))}</b>.</p>`:''}</div>`}
function newBalHtml(){const t=finalCalc();if(t.err)return`<div class="hint" style="color:var(--red)">${esc(t.err)}</div>`;const walk=C.cid==='walkin';const paid=paidNow(t.total);
 if(isNaN(paid))return'<div class="hint" style="color:var(--red)">Received amount is not a number.</div>';
 if(walk){return paid>=t.total?`<div class="tot big"><span>Return change</span><span>${rs(paid-t.total)}</span></div>`:`<div class="hint" style="color:var(--red)">Walk-in sale must be paid in full (${rs(t.total)}). Pick a client to give on credit.</div>`}

function fillToday(){const el=$('#c-today');if(!el)return;const T=today();const list=S.bills.filter(b=>dstr(new Date(b.createdAt))===T||b.date===T).sort((a,b)=>b.createdAt-a.createdAt);

  let disc=o.disc!=null?o.disc:(r&&r.disc!=null&&r.disc!==''?r.disc:(m.disc||0));disc=Math.min(num(disc),cap());

 const ops=[];const st={...S.settings};

 if(!old)ops.push({store:'settings',value:st});
 const delta={};if(old)for(const it of old.items)delta[it.medId]=(delta[it.medId]||0)+it.tablets;

 const short=[];for(const[mid,dv]of Object.entries(delta)){if(!dv)continue;const m=med(mid);if(!m)continue;const nm={...m,stockTab:(m.stockTab||0)+dv};if(nm.stockTab<0)short.push(medLabel(m));ops.push({store:'meds',value:nm})}
 const op=old?linkedPay(old.id):null;
 if(paid>0)ops.push({store:'payments',value:{id:op?op.id:uid(),clientId:b.clientId,date,amount:paid,mode,billId:b.id,note:'',voided:false,createdAt:op?op.createdAt:Date.now()+1,sample:op?!!op.sample:false,practice:isPractice()}});
 else if(op)ops.push({store:'payments',value:{...op,voided:true}});

 const ov=modal(`Bill #${b.no}`,`<p class="mute">${fdate(b.date)} · ${esc(c?c.name:'Walk-in')}${b.editedAt?' · edited':''}${b.voided?' · <b style="color:var(--red)">VOIDED</b>':''}</p>
 <table class="t ${b.voided?'void':''}"><thead><tr><th>Medicine</th><th>Qty</th><th class="r">Amount</th></tr></thead><tbody>${b.items.map(it=>`<tr><td>${esc(it.name)}<div class="mute">${rs(it.mrp)} per ${packDesc(it,it.medTps)}${it.disc?' · '+it.disc+'% off':''}</div></td><td>${qtyText(it)}${it.tps!==it.medTps?`<div class="mute">${fm(it).pack} of ${it.tps}</div>`:''}</td><td class="r">${rs(it.net)}</td></tr>`).join('')}</tbody></table>

 ${b.adjust?`<div class="tot"><span>Changed by pharmacist${b.adjNote?' · '+esc(b.adjNote):''}</span><span>${b.adjust>0?'+':''}${rs(b.adjust)}</span></div>`:''}<div class="tot big"><span>Bill total</span><span>${rs(b.total)}</span></div><div class="tot" style="background:var(--pri2);border-radius:8px;padding:6px 8px;margin:4px 0"><b class="money-in">Net savings on this bill after applied discounts</b><b class="money-in">${rs(Math.max(0,savedOn(b)))}</b></div>
 <div class="tot"><span>Paid by</span><span class="${lp?'money-in':'due'}">${lp?rs(lp.amount)+' · '+MODE_TXT[lp.mode]+(lp.amount<b.total?` · ${rs(b.total-lp.amount)} on credit`:''):(b.clientId?'Credit · all on khata':'—')}</span></div>
 ${rets.length?`<div class="tot"><span>Returned</span><span class="money-in">−${rs(rets.reduce((s,r)=>s+r.total,0))}</span></div><div class="mute">${rets.map(r=>fdate(r.date)+': '+r.items.map(i=>esc(i.name)+' '+i.tablets+' '+pl(i.unit||'tablet',i.tablets)).join(', ')).join('<br>')}</div>`:''}
 ${pos?`<div class="tot"><span>Due right after this bill</span><span>${rs(pos.after)}</span></div><div class="tot"><span>Total due now</span><span class="${pos.now>0?'due':''}">${rs(pos.now)}</span></div>`:''}
 <div class="acts"><button class="btn wa" data-act="shareBill" data-id="${b.id}">Send itemized PDF</button>${b.voided?'':`<button class="btn" data-act="amtBill" data-id="${b.id}">✎ Change amount</button><button class="btn" data-act="editBill" data-id="${b.id}">Edit items</button><button class="btn" data-act="returnBill" data-id="${b.id}">Return packs</button><button class="btn red" data-act="voidBill" data-id="${b.id}">Void</button>`}</div>
 ${b.voided?'':'<p class="hint">Change amount, edit, return and void need the pharmacist PIN.</p>'}`)}
async function editBill(id){const b=bill(id);if(billReturns(id).length)return toast('This bill has a return on it. Make another return or void the bill instead.',4000);
 if(!(await askPin(`Edit bill #${b.no}`)))return;const lp=linkedPay(id);
 C.cid=b.clientId||'walkin';C.cart=b.items.map(it=>({medId:it.medId,name:it.name,salt:it.salt,mrp:it.mrp,medTps:it.medTps,form:it.form,pack:it.pack,unit:it.unit,looseOk:it.looseOk,kind:it.kind,tps:it.tps,strips:it.strips,loose:it.loose,disc:it.disc}));C.paid=lp?String(lp.amount/100):'';C.override=b.adjust?String(b.total/100):'';C.ovrOpen=!!b.adjust;C.mode=lp?lp.mode:(b.clientId?'credit':'cash');C.date=b.date;C.edit=b.id;closeAll();go('counter')}
async function returnBill(id){const b=bill(id);if(!(await askPin(`Return packs on bill #${b.no}`)))return;
 const rows=b.items.map((it,i)=>{const left=it.tablets-returnedTabs(b.id,it.medId);return{it,i,left}});
 if(!rows.some(r=>r.left>0))return toast('Everything on this bill is already returned');
 const ov=modal(`Return on bill #${b.no}`,`${rows.map(r=>`<div class="line"><b>${esc(r.it.name)}</b><div class="mute">Sold ${qtyText(r.it)} (${r.it.tablets} ${pl(fm(r.it).unit,r.it.tablets)}) · can return ${r.left} ${pl(fm(r.it).unit,r.left)}</div>${r.left>0?`<div class="grid2"><div><label>${cap1(pl(fm(r.it).pack,2))} back</label><input data-rs="${r.i}" inputmode="numeric" placeholder="0"></div>${fm(r.it).loose?`<div><label>Loose ${pl(fm(r.it).unit,2)} back</label><input data-rl="${r.i}" inputmode="numeric" placeholder="0"></div>`:''}</div>`:''}</div>`).join('')}
 <label>Return date</label><input type="date" id="rt-date" value="${today()}" min="${b.date}" max="${today()}">
 <div class="tot big"><span>${b.clientId?'Comes off the khata':'Give back in cash'}</span><span id="rt-amt">₹0</span></div>
 <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="rt-save">Save return</button></div><p class="hint">Stock goes back on the shelf. Refund is at the price actually charged (after discount).</p>`);
 const calc=()=>{let total=0,err='';const items=[];for(const r of rows){if(r.left<=0)continue;const s=int(($(`[data-rs="${r.i}"]`,ov)||{}).value),l=int(($(`[data-rl="${r.i}"]`,ov)||{}).value);const tabs=s*r.it.tps+l;if(!tabs)continue;if(tabs>r.left)err=`${r.it.name}: only ${r.left} ${pl(fm(r.it).unit,r.left)} can come back`;const amt=Math.round(r.it.net*tabs/r.it.tablets);total+=amt;items.push({medId:r.it.medId,name:r.it.name,unit:fm(r.it).unit,tablets:tabs,amount:amt})}return{total,items,err}};
 ov.addEventListener('input',()=>{$('#rt-amt',ov).textContent=rs(calc().total)});
 $('#rt-save',ov).onclick=async()=>{const{total,items,err}=calc();if(err)return toast(err);if(!items.length)return toast('Enter what is coming back');const d=$('#rt-date',ov).value||today();if(d<b.date)return toast('Return cannot be before the bill date');
  const ops=[{store:'returns',value:{id:uid(),billId:b.id,clientId:b.clientId,date:d,items,total,voided:false,createdAt:Date.now(),sample:false,practice:isPractice()}}];
  for(const i of items){const m=med(i.medId);if(m)ops.push({store:'meds',value:{...m,stockTab:m.stockTab+i.tablets}})}
  await commit(ops);closeAll();toast(`Return saved · ${rs(total)}${b.clientId?' off the khata':' to give back'}`);render()}}
async function voidBill(id){const b=bill(id);if(!(await askPin(`Void bill #${b.no}`)))return;const lp=linkedPay(id);
 if(!(await confirmBox(`Void bill #${b.no} (${rs(b.total)})? Its medicines go back on the shelf${lp?`, and the ${rs(lp.amount)} received with it is removed (hand it back)`:''}. It stays in the list, crossed out.`,'Void bill',true)))return;
 const ops=[{store:'bills',value:{...b,voided:true,voidedAt:Date.now()}}];
 for(const it of b.items){const back=it.tablets-returnedTabs(b.id,it.medId);const m=med(it.medId);if(m&&back>0)ops.push({store:'meds',value:{...m,stockTab:m.stockTab+back}})}
 // merge stock ops for duplicate meds
 const merged={};for(const o of ops.filter(o=>o.store==='meds'))merged[o.value.id]=(merged[o.value.id]||0)+(o.value.stockTab-med(o.value.id).stockTab);
 const final=ops.filter(o=>o.store!=='meds');for(const[mid,dv]of Object.entries(merged)){const m=med(mid);final.push({store:'meds',value:{...m,stockTab:m.stockTab+dv}})}
 for(const r of billReturns(id))final.push({store:'returns',value:{...r,voided:true}});
 if(lp)final.push({store:'payments',value:{...lp,voided:true,voidedAt:Date.now()}});
 await commit(final);closeAll();toast(`Bill #${b.no} voided`);render()}

async function amtBill(id){const b=bill(id);if(!(await askPin(`Change the amount of bill #${b.no}`)))return;
 const calc=b.total-(b.adjust||0);const lp=linkedPay(b.id);const rets=billReturns(b.id).reduce((s,r)=>s+r.total,0);

 <p class="hint">Medicines and stock stay as they are. Only the amount changes, on the bill, the khata and the month bill. It cannot go above the MRP total.${!b.clientId?' For a walk-in sale the cash received changes to match.':''}</p>`);

 const save=async v=>{if(isNaN(v)||v<=0)return toast('Enter a valid amount');if(v>b.gross)return toast(`Cannot be more than the MRP total ${rs(b.gross)}`);
  if(rets&&v<rets)return toast(`Returns of ${rs(rets)} are already on this bill. Amount cannot go below that.`);
  if(v===b.total){closeModal(ov);return toast('Amount is the same')}
  if(ymOf(b.date)<thisYM()&&!(await confirmBox(`Bill #${b.no} is from <b>${mName(ymOf(b.date))}</b>. This changes that month’s statement and every closing after it. Continue?`,'Change it')))return;
  const ops=[{store:'bills',value:{...b,total:v,adjust:v-calc,adjNote:v===calc?'':$('#ab-r',ov).value.trim(),editedAt:Date.now()}}];
  if(!b.clientId&&lp)ops.push({store:'payments',value:{...lp,amount:v}});
  await commit(ops);closeAll();toast(`Bill #${b.no} is now ${rs(v)}`);render()};
 $('#ab-save',ov).onclick=()=>save(toP(inp.value));inp.onkeydown=e=>{if(e.key==='Enter')save(toP(inp.value))};

async function clearSample(alsoTyped){const gone=x=>x.sample||(alsoTyped&&x.practice);
 const keepMed=new Set(),keepCli=new Set();
 for(const b of S.bills)if(!gone(b)){b.items.forEach(i=>keepMed.add(i.medId));if(b.clientId)keepCli.add(b.clientId)}

async function eraseAllLocal(){
 try{

/* ---------- tiny PDF writer: the bill picture becomes A4 pages (works offline, no library) ---------- */
const blobBytes=b=>b.arrayBuffer?b.arrayBuffer().then(x=>new Uint8Array(x)):new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)});
const pdfStr=s=>String(s).replace(/[^\x20-\x7E]/g,'').replace(/([()\\])/g,'\\$1');
async function canvasToPdf(canvas,title){const W=595.28,H=841.89,M=22;const cw=canvas.width,ch=canvas.height;const avail=Math.floor((H-2*M)*cw/W);const brks=canvas._breaks||[];const pages=[];
 let start=0;while(start<ch){let end=Math.min(ch,start+avail);if(end<ch){const ok=brks.filter(b=>b>start+avail*0.3&&b<=end);if(ok.length)end=ok[ok.length-1]}
  const h=end-start;const c=document.createElement('canvas');c.width=cw;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,h);g.drawImage(canvas,0,start,cw,h,0,0,cw,h);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));if(!blob)throw new Error('This phone could not draw the page');pages.push({w:cw,h,data:await blobBytes(blob)});start=end}
 const enc=new TextEncoder();const parts=[];let len=0;const offs=[];const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
 const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);typeof body==='string'?push(body):body();push('\nendobj\n')};
 push('%PDF-1.4\n');const n=pages.length;
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${4+3*i} 0 R`).join(' ')}] /Count ${n} >>`);obj(3,`<< /Title (${pdfStr(title)}) /Producer (Counter Khata) >>`);
 pages.forEach((p,i)=>{const dw=W,dh=p.h*W/p.w;const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} 0 ${(H-M-dh).toFixed(2)} cm /Im0 Do Q`;
  obj(4+3*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${6+3*i} 0 R >> >> /Contents ${5+3*i} 0 R >>`);
  obj(5+3*i,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  obj(6+3*i,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.data.length} >>\nstream\n`);push(p.data);push('\nendstream')})});
 const size=4+3*n,xref=len;let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let k=1;k<size;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
 push(x);push(`trailer\n<< /Size ${size} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
 return{blob:new Blob(parts,{type:'application/pdf'}),pages:n}}

 render()}
start();
